apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-runtime-secrets
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: litellm-runtime-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        DATABASE_URL: "postgresql://{{ .db_user | urlquery }}:{{ .db_password | urlquery }}@__RDS_ENDPOINT__:5432/litellm?schema=public&connection_limit=10&sslmode=require&sslcert=/certs/rds-ca.pem&sslaccept=strict"
        REDIS_URL: "rediss://:{{ .redis_password | urlquery }}@__REDIS_ENDPOINT__:6379/0?ssl_cert_reqs=required&ssl_ca_certs=/certs/public-ca.pem&ssl_check_hostname=true"
        LITELLM_MASTER_KEY: "{{ .master_key }}"
        LITELLM_SALT_KEY: "{{ .salt_key }}"
        ## Langfuse secrets
        LANGFUSE_PUBLIC_KEY: "{{ .langfusePublicKey }}"
        LANGFUSE_SECRET_KEY: "{{ .langfuseSecretKey }}"
        LANGFUSE_OTEL_HOST: "http://langfuse-web.langfuse.svc.cluster.local:3000"
        ## Tavily search tool
        TAVILY_API_KEY: "{{ .tavilyApiKey }}"
  data:
    - secretKey: db_user
      remoteRef:
        key: "__RDS_SECRET_ARN__"
        property: username
    - secretKey: db_password
      remoteRef:
        key: "__RDS_SECRET_ARN__"
        property: password
    - secretKey: redis_password
      remoteRef:
        key: "__REDIS_SECRET_ARN__"
        property: REDIS_PASSWORD
    - secretKey: master_key
      remoteRef:
        key: "__APP_SECRET_ARN__"
        property: LITELLM_MASTER_KEY
    - secretKey: salt_key
      remoteRef:
        key: "__APP_SECRET_ARN__"
        property: LITELLM_SALT_KEY
    ## Langfuse secrets 값 추가
    - secretKey: langfusePublicKey
      remoteRef:
        key: "__APP_SECRET_ARN__"
        property: LANGFUSE_PUBLIC_KEY
    - secretKey: langfuseSecretKey
      remoteRef:
        key: "__APP_SECRET_ARN__"
        property: LANGFUSE_SECRET_KEY
    ## Tavily secrets 값 추가
    - secretKey: tavilyApiKey
      remoteRef:
        key: "__APP_SECRET_ARN__"
        property: TAVILY_API_KEY
