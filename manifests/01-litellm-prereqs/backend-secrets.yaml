# RDS master account and Redis AUTH, used by the litellm-db-init hook Job.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-backend-secrets
  namespace: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: litellm-backend-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: "arn:aws:secretsmanager:us-east-1:762491855071:secret:rds!db-7a18b9a2-1065-472c-aad1-108da2f45724-iBzM5T"
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: "arn:aws:secretsmanager:us-east-1:762491855071:secret:rds!db-7a18b9a2-1065-472c-aad1-108da2f45724-iBzM5T"
        property: password
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: "arn:aws:secretsmanager:us-east-1:762491855071:secret:aws-ue1-litellm-redis-auth-UUmoM0"
        property: REDIS_PASSWORD
